services:
  ctf:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./app:/app/app          # dev: live code reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach Ollama / LiteLLM on the host
    restart: unless-stopped
