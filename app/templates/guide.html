<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTF Admin Guide</title>
  <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="bg-slate-950 text-slate-200 p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex flex-wrap items-center gap-3">
      <h1 class="text-xl font-bold">🔐 Admin guide (secret)</h1>
      <a href="/admin" class="rounded bg-slate-800 px-3 py-1 text-sm hover:bg-slate-700">← Board</a>
      <span id="meta" class="text-xs text-slate-400"></span>
    </div>
    <p class="text-sm text-amber-300">Facilitators only. This page shows flags and answers. Never project it.</p>

    <section class="rounded-lg border border-slate-800 bg-slate-900 p-4 space-y-3">
      <h2 class="font-semibold">Team lookup (what exactly does this team see?)</h2>
      <form id="lookup" class="flex gap-2">
        <input id="sid" class="flex-1 min-w-0 rounded bg-slate-800 px-3 py-2 text-sm font-mono" placeholder="Session id from the board (first 4-8 characters)">
        <button class="rounded bg-indigo-600 hover:bg-indigo-500 px-4 py-2 text-sm">Look up</button>
      </form>
      <div id="team" class="space-y-3"></div>
    </section>

    <section class="space-y-3">
      <h2 class="font-semibold">Levels, flags and fixes</h2>
      <div id="levels" class="space-y-3"></div>
    </section>

    <section class="space-y-2">
      <h2 class="font-semibold">General problems</h2>
      <div id="general" class="space-y-2"></div>
    </section>
  </div>
  <script src="/static/guide.js"></script>
</body>
</html>
